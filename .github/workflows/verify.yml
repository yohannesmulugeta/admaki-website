name: Verify website build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check portfolio image sizes and paths
        run: node scripts/check-cover-budget.mjs
      - name: Check static Next.js export
        run: npm run build
