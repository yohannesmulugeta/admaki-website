<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#07080b"/>
  <!-- Ambient glow -->
  <circle cx="600" cy="400" r="300" fill="url(#glow1)" opacity="0.4"/>
  <!-- Grid -->
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid1)"/>
  
  <!-- Outer architectural frame -->
  <rect x="60" y="60" width="1080" height="680" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
  
  <!-- Large numeral watermark -->
  <text x="600" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="900" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" text-anchor="middle" letter-spacing="-0.05em">01</text>
  
  <!-- Geometric layered elements -->
  <rect x="420" y="220" width="360" height="360" rx="12" stroke="rgba(56,189,248,0.3)" stroke-width="1" fill="rgba(255,255,255,0.01)"/>
  <rect x="460" y="260" width="280" height="280" rx="8" stroke="rgba(99,102,241,0.25)" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <circle cx="600" cy="400" r="60" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
  
  <!-- Crosshairs and tech cues -->
  <path d="M 590 400 L 610 400 M 600 390 L 600 410" stroke="rgba(56,189,248,0.8)" stroke-width="1.5"/>
  <text x="100" y="110" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="0.2em">ARCHIVE REF // CASE_01</text>
  <text x="1100" y="110" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="end" letter-spacing="0.2em">SOCIAL MEDIA CAMPAIGN</text>
  <text x="100" y="700" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="0.15em">LATENCY: 0.00ms • ASSET BUFFER READY</text>
  <text x="1100" y="700" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="end" letter-spacing="0.15em">[ ADMAKI STUDIO ]</text>
</svg>
