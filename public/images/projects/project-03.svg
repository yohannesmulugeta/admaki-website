<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#07080b"/>
  <!-- Ambient glow -->
  <circle cx="600" cy="400" r="320" fill="url(#glow3)" opacity="0.35"/>
  <defs>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid3)"/>
  
  <rect x="60" y="60" width="1080" height="680" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
  <text x="600" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="900" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" text-anchor="middle" letter-spacing="-0.05em">03</text>
  
  <!-- System Architecture & Telemetry Grid -->
  <g transform="translate(350, 250)">
    <rect x="0" y="0" width="500" height="300" rx="8" stroke="rgba(52,211,153,0.3)" stroke-width="1" fill="rgba(0,0,0,0.4)"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="11" fill="rgba(52,211,153,0.9)">ERP STATE RUNTIME // CLUSTER_ONLINE</text>
    
    <!-- Modular blocks -->
    <rect x="30" y="70" width="120" height="80" rx="6" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="rgba(255,255,255,0.02)"/>
    <path d="M 150 110 L 190 110" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
    <rect x="190" y="70" width="120" height="80" rx="6" stroke="rgba(56,189,248,0.4)" stroke-width="1" fill="rgba(56,189,248,0.05)"/>
    <path d="M 310 110 L 350 110" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
    <rect x="350" y="70" width="120" height="80" rx="6" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="rgba(255,255,255,0.02)"/>
    
    <!-- Metrics bars -->
    <rect x="30" y="180" width="440" height="80" rx="6" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="rgba(255,255,255,0.01)"/>
    <line x1="60" y1="230" x2="160" y2="230" stroke="#34d399" stroke-width="3"/>
    <line x1="180" y1="230" x2="320" y2="230" stroke="#38bdf8" stroke-width="3"/>
    <line x1="340" y1="230" x2="440" y2="230" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  </g>
  
  <text x="100" y="110" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="0.2em">ARCHIVE REF // CASE_03</text>
  <text x="1100" y="110" font-family="monospace" font-size="12" fill="#34d399" text-anchor="end" letter-spacing="0.2em">MANAGEMENT SYSTEM</text>
  <text x="100" y="700" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="0.15em">PIPELINE: POSTGRESQL • REDIS • REST/GQL</text>
  <text x="1100" y="700" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="end" letter-spacing="0.15em">[ ADMAKI STUDIO ]</text>
</svg>
